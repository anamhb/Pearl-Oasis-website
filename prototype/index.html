<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frame Lab</title>
    <style>
      html, body { margin: 0; background: #090a0c; }
      #stage { position: fixed; inset: 0; overflow: hidden; background: #090a0c; }
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0;
        pointer-events: none;
      }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 2;
        color: #d4af37;
        font: 11px/1.4 monospace;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 6px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <div id="status">loading</div>
    <script>
      const sets = {
        'hero-original': { folder: 'hero-original', frames: [1, 40, 80, 120, 160, 200, 240, 280, 299] },
        'hero-phone': { folder: 'hero-phone', frames: [1, 40, 80, 120, 160, 200, 240, 280, 299] },
        'hero-tablet': { folder: 'hero-tablet', frames: [1, 40, 80, 120, 160, 200, 240, 280, 299] },
        'story-original': { folder: 'story-original', frames: [1, 8, 15, 22, 29, 36, 43, 50, 56] },
        'story-portrait': { folder: 'story-portrait', frames: [1, 8, 15, 22, 29, 36, 43, 50, 56] },
        'hero-original-verify': { folder: 'hero-original-verify', frames: [1, 150, 299] },
        'hero-phone-verify': { folder: 'hero-phone-verify', frames: [1, 150, 299] },
      };

      const params = new URLSearchParams(location.search);
      const setName = params.get('set') || 'hero-original';
      const interval = Number(params.get('interval') || 120);
      const still = params.get('still');
      const config = sets[setName] || sets['hero-original'];
      const frameSrc = (index) =>
        `frames/${config.folder}/ezgif-frame-${String(config.frames[index]).padStart(3, '0')}.jpg`;

      const stage = document.getElementById('stage');
      const status = document.getElementById('status');
      const MAX_LAYERS = 4;
      const layers = Array.from({ length: MAX_LAYERS }, (_, index) => {
        const node = document.createElement('img');
        node.decoding = 'async';
        node.draggable = false;
        node.alt = '';
        node.style.opacity = index === 0 ? '1' : '0';
        stage.appendChild(node);
        return { node, index: index === 0 ? 0 : null, loading: false, ready: index === 0, token: 0, timer: 0 };
      });

      const perf = (window.__lab = {
        start: performance.now(),
        running: true,
        decodes: [],
        reveals: [],
        raf: [],
        samples: [],
        longtasks: [],
        loaf: [],
        resources: [],
        set: setName,
        interval,
        still: still === null ? null : Number(still),
      });

      const originalDecode = HTMLImageElement.prototype.decode;
      HTMLImageElement.prototype.decode = function () {
        const src = this.currentSrc || this.src || '';
        if (!src.includes(config.folder)) return originalDecode.apply(this, arguments);
        const t0 = performance.now();
        return originalDecode.apply(this, arguments).then(
          (value) => {
            perf.decodes.push({ t: performance.now() - perf.start, d: performance.now() - t0, src });
            return value;
          },
          (error) => {
            perf.decodes.push({ t: performance.now() - perf.start, d: performance.now() - t0, src, failed: true });
            throw error;
          },
        );
      };

      let active = 0;
      let visibleIndex = 0;
      let target = 0;
      let direction = 1;
      let paused = false;

      function reveal(layer) {
        if (layer.index === null || !layer.ready) return;
        if (layer === layers[active]) {
          visibleIndex = layer.index;
          return;
        }
        const previous = layers[active];
        layer.node.style.opacity = '1';
        previous.node.style.opacity = '0';
        active = layers.indexOf(layer);
        visibleIndex = layer.index;
        perf.reveals.push({ t: performance.now() - perf.start, index: layer.index, src: layer.node.currentSrc });
      }

      function showBest() {
        let best = null;
        for (const layer of layers) {
          if (!layer.ready || layer.index === null) continue;
          const score = Math.abs(layer.index - target);
          if (!best || score < best.score) best = { layer, score };
        }
        if (!best) return;
        if (best.layer === layers[active]) {
          visibleIndex = best.layer.index;
          return;
        }
        if (best.score >= Math.abs(visibleIndex - target)) return;
        reveal(best.layer);
      }

      function load(layer, index) {
        if (!layer) return;
        const token = ++layer.token;
        layer.index = index;
        layer.loading = true;
        layer.ready = false;
        clearTimeout(layer.timer);
        const src = frameSrc(index);
        const finish = () => {
          if (layer.token !== token || !layer.loading) return;
          if (layer.node.naturalWidth === 0) {
            layer.loading = false;
            return;
          }
          layer.loading = false;
          layer.ready = true;
          clearTimeout(layer.timer);
          showBest();
          schedule();
        };
        layer.node.onload = () => {
          if (layer.token !== token) return;
          layer.timer = setTimeout(finish, 800);
          if (typeof layer.node.decode === 'function') layer.node.decode().then(finish, finish);
          else finish();
        };
        layer.node.onerror = () => {
          if (layer.token !== token) return;
          clearTimeout(layer.timer);
          layer.loading = false;
          layer.ready = false;
          layer.index = null;
        };
        layer.node.src = src;
      }

      function schedule() {
        if (!perf.running) return;
        const desired = [];
        for (let offset = 0; offset < MAX_LAYERS; offset += 1) {
          const index = Math.min(config.frames.length - 1, Math.max(0, target + direction * offset));
          if (!desired.includes(index)) desired.push(index);
        }
        for (const index of desired) {
          const present = layers.some((layer) => layer.index === index && (layer.loading || layer.ready));
          if (present) continue;
          let layer = layers.find((candidate) => candidate !== layers[active] && !candidate.loading && !candidate.ready);
          if (!layer) {
            const candidates = layers.filter((candidate) => candidate !== layers[active] && candidate.ready && !desired.includes(candidate.index));
            if (candidates.length) layer = candidates[0];
          }
          if (layer) load(layer, index);
        }
      }

      function advance() {
        if (!perf.running) return;
        if (target >= config.frames.length - 1) direction = -1;
        else if (target <= 0) direction = 1;
        target += direction;
        showBest();
        schedule();
      }

      const observerOptions = { entryTypes: ['longtask'] };
      try {
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) perf.longtasks.push({ t: entry.startTime - perf.start, d: entry.duration });
        }).observe(observerOptions);
      } catch {}
      try {
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            perf.loaf.push({
              t: entry.startTime - perf.start,
              d: entry.duration,
              blocking: entry.blockingDuration,
              styleLayout: entry.styleAndLayoutStart ? entry.styleAndLayoutStart - perf.start : null,
            });
          }
        }).observe({ entryTypes: ['long-animation-frame'] });
      } catch {}

      let lastFrame = 0;
      function tick(time) {
        if (!perf.running) return;
        if (lastFrame) perf.raf.push(time - lastFrame);
        lastFrame = time;
        perf.samples.push({ t: time - perf.start, target, visible: visibleIndex });
        requestAnimationFrame(tick);
      }

      perf.stop = () => {
        perf.running = false;
        perf.end = performance.now() - perf.start;
        perf.resources = performance.getEntriesByType('resource')
          .filter((entry) => entry.name.includes(config.folder))
          .map((entry) => ({ name: entry.name.split('/').pop(), duration: entry.duration, transfer: entry.transferSize }));
        perf.images = layers.map((layer) => ({
          src: (layer.node.currentSrc || '').split('/').pop(),
          opacity: layer.node.style.opacity,
          nw: layer.node.naturalWidth,
          nh: layer.node.naturalHeight,
        }));
        status.textContent = `${setName} / ${interval}ms\n${perf.decodes.length} decodes / ${perf.reveals.length} reveals`;
        return true;
      };

      if (still !== null) {
        const index = Math.min(config.frames.length - 1, Math.max(0, Number(still)));
        layers[0].node.src = frameSrc(index);
        layers[0].node.style.opacity = '1';
        layers[0].index = index;
        status.textContent = `${setName} / still ${index}`;
        perf.running = false;
      } else {
        requestAnimationFrame(tick);
        layers[0].node.src = frameSrc(0);
        layers[0].ready = true;
        schedule();
        setInterval(advance, interval);
        status.textContent = `${setName} / ${interval}ms`;
      }
    </script>
  </body>
</html>
